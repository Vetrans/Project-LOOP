services:
  - type: web
    name: loop-ai-service
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false          # paste your Atlas connection string in the Render dashboard after creation
      - key: ANTHROPIC_API_KEY
        sync: false          # optional — leave unset to use graceful fallback mode
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6

  - type: web
    name: loop-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false          # same Atlas connection string as ai-service, must match
      - key: JWT_SECRET
        generateValue: true  # Render generates a random secret for you
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: loop-ai-service
          property: host
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: loop-frontend
          property: host

  - type: web
    name: loop-frontend
    runtime: static
    rootDir: loop-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: loop-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html